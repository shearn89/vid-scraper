<!DOCTYPE html>
<!--
Uscreen program (player) page, farmvids.example.

Modelled on the rendered DOM of the nested turbo-frames such a program page
lazy-loads. Hosts, titles and identifiers are invented; the structure is what
matters and is reproduced faithfully. Trimmed to what bears on discovery: the
controls, sharing modal, calendar widgets and analytics spans are dropped.

What this exercises:

  - turbo-frames nested three deep, each with its own src. Following them is
    the only way to reach the player: server-rendered HTML has the addresses
    and none of the content.
  - a <turbo-frame> with no src (program_player) — already-rendered content,
    nothing to fetch.
  - the master HLS manifest on <source> inside <video>, inside a
    <video-player> custom element.
  - <video src="blob:..."> — a MediaSource handle, not a fetchable URL. It
    must not be reported as a video.
  - poster= and storyboard image URLs that must not be mistaken for media.
  - related-video cards, which are ordinary anchors to further program pages.
-->
