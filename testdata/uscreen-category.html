Uscreen storefront category listing (farmvids.example, "New Farmyard Friends").

Modelled on the rendered DOM of the <turbo-frame id="category_content">
that such a storefront lazy-loads from its CDN. Hosts, titles and identifiers
are invented; the structure is what matters and is reproduced faithfully. The
server response for the containing page holds none of this: the frame is empty
markup until the browser fetches it with a session cookie.

Trimmed to 4 of the 32 cards. Every card is structurally identical, so the
remainder add bulk without adding coverage. What each card exercises:

  - two <a> elements per card sharing one href: the image link and the
    title link. The image link comes first and its only text is the
    duration badge, so naive first-wins title extraction labels the video
    "11:36" rather than "It's Seed Time".
  - hrefs are program pages, not media files. No extension to classify.
  - the real title also sits in title=/aria-label= on the second anchor,
    and in alt= on the img.
  - <swiper-slide> custom elements wrapping each card.
-->
